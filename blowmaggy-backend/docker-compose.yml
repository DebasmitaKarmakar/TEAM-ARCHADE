# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: blowmaggy-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blowmaggy
    ports:
      - "5432:5432"
    volumes:
      - blowmaggy-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
volumes:
  blowmaggy-pg:
